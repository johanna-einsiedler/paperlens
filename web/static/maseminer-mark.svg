  <line x1="206" y1="56" x2="221" y2="36"
        stroke="#1d4a8c" stroke-width="1.5"
        stroke-dasharray="3 3" stroke-linecap="round"/>
  <rect x="210" y="18" width="22" height="22" rx="3" fill="#5cb8c8"/>
</svg>

     viewBox="0 0 240 250"
     role="img"
     aria-label="MASEMiner mark">
  <g>
    <rect x="40"  y="50"  width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="40"  y="84"  width="30" height="30" rx="3" fill="#3a6cad"/>
    <rect x="40"  y="118" width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="40"  y="152" width="30" height="30" rx="3" fill="#3a6cad"/>
    <rect x="40"  y="186" width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="74"  y="84"  width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="108" y="118" width="30" height="30" rx="3" fill="#3a6cad"/>
    <rect x="142" y="84"  width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="176" y="50"  width="30" height="30" rx="3" fill="#1d4a8c"/>
    <rect x="176" y="84"  width="30" height="30" rx="3" fill="#3a6cad"/>
    <rect x="176" y="118" width="30" height="30" rx="3" fill="#1d4a8c"/>

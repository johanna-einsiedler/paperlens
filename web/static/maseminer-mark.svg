<?xml version="1.0" encoding="UTF-8"?>
<!--
  MASEMiner mark only (no wordmark) — for use in the page header on the
  flow page where the appTitle h1 already renders "MASEMiner" beside it.

  Same 5×5 blocky-M letterform + detached teal tile as the full
  maseminer-logo.svg, just without the text below.
-->
